services:
  relay:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:42067:3000"
    read_only: true
    environment:
      DB_PATH: /data/accounts.sqlite
      PUBLIC_ORIGIN: https://fish.40-160-53-64.sslip.io
      TRUST_PROXY: "1"
    volumes:
      - accounts:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 192m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  accounts:
