services:
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik
      - relay
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.fishing-idle.rule: "Host(`fish.40-160-53-64.sslip.io`)"
      traefik.http.routers.fishing-idle.entrypoints: web-secure
      traefik.http.routers.fishing-idle.tls.certresolver: default
      traefik.http.services.fishing-idle.loadbalancer.server.port: "80"
      traefik.http.routers.fishing-idle-http.rule: "Host(`fish.40-160-53-64.sslip.io`)"
      traefik.http.routers.fishing-idle-http.entrypoints: web
      traefik.http.routers.fishing-idle-http.middlewares: fishing-idle-https
      traefik.http.middlewares.fishing-idle-https.redirectscheme.scheme: https
      traefik.http.middlewares.fishing-idle-https.redirectscheme.permanent: "true"
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
networks:
  traefik:
    external: true
  relay:
    external: true
    name: fishrelay_default
